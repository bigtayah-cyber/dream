name: build-macos
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests des moteurs (Voile et Orbe)
        run: |
          clang++ -O2 -std=c++17 tests/offline.cpp -o offline_test && ./offline_test
          clang++ -O2 -std=c++17 tests/orbe_test.cpp -o orbe_test && ./orbe_test
          clang++ -O2 -std=c++17 tests/onek_test.cpp -o onek_test && ./onek_test

      - name: Configurer (binaire universel arm64 + x86_64)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Compiler VST3 et AU
        run: cmake --build build --config Release -j 4

      - name: Signer (ad hoc) et empaqueter
        run: |
          mkdir -p dist
          find build -name "*.vst3" -type d -prune | while read -r VST; do
            P=$(basename "$VST" .vst3)
            AU="$(dirname "$VST")/../AU/$P.component"
            [ -d "$AU" ] || AU=$(find build -name "$P.component" -type d | head -1)
            codesign --force --deep -s - "$VST"
            codesign --force --deep -s - "$AU"
            cp -R "$VST" "$AU" dist/
            echo "$P architectures : $(lipo -archs "$VST/Contents/MacOS/$P")" | tee -a validation.txt
          done
          # deux paquets (GitHub refuse un fichier de plus de 100 Mo) : effets et instruments
          mkdir -p dist-instruments
          for N in "Orbe" "Orbe Synth" "Orbe 808" "Orbe Beat" "Orbe Pads" "Orbe Sample" "Orbe Fredonne"; do
            mv "dist/$N.vst3" "dist/$N.component" dist-instruments/ 2>/dev/null || true
          done
          mkdir -p dist-studio
          for N in "Orbe FX" "Orbe Cabine" "Orbe Master" "Orbe EQ" "Orbe Detect" "Orbe Mix" "Orbe Galet" "Orbe Accroc"; do
            mv "dist/$N.vst3" "dist/$N.component" dist-studio/ 2>/dev/null || true
          done
          for D in dist dist-studio dist-instruments; do
            cp installer/Installer-dreamaws.command $D/
            chmod +x $D/Installer-dreamaws.command
          done
          ditto -c -k dist dreamaws-voix-macOS.zip
          ditto -c -k dist-studio dreamaws-studio-macOS.zip
          ditto -c -k dist-instruments dreamaws-instruments-macOS.zip

      - name: Vérifier les 26 plugins (VST3 et AU)
        run: |
          # Un plugin absent fait échouer le job (la liste est explicite : 26 plugins).
          MISSING=0
          for N in "Voile" "Grain Nord" "Gorge" "Poupee" "Patine" \
                   "Orbe Looks" "Orbe Atelier" "Orbe Autotune" "Orbe Denoiser" "Orbe DeEsser" "Orbe Relance" \
                   "Orbe" "Orbe Synth" "Orbe 808" "Orbe Beat" "Orbe Pads" "Orbe Sample" "Orbe Fredonne" \
                   "Orbe FX" "Orbe Cabine" "Orbe Master" "Orbe EQ" "Orbe Detect" "Orbe Mix" "Orbe Galet" "Orbe Accroc"; do
            for EXT in vst3 component; do
              F=$(ls -d dist/"$N.$EXT" dist-studio/"$N.$EXT" dist-instruments/"$N.$EXT" 2>/dev/null | head -1 || true)
              if [ -z "$F" ] || [ ! -f "$F/Contents/MacOS/$N" ]; then
                echo "::error::Plugin manquant : $N.$EXT"; MISSING=$((MISSING+1))
              fi
            done
          done
          echo "Plugins manquants : $MISSING"
          [ "$MISSING" -eq 0 ]

      - name: Valider (pluginval niveau 10, VST3 et AU)
        continue-on-error: true
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pv.zip
          mkdir -p pv-logs
          # Un AU n'est trouvé par macOS (AudioComponentFindNext) que s'il est installé dans un
          # dossier Components : validé depuis dist/, pluginval échoue au scan (« 1 test failed,
          # out of a total of 1 ») sans rien tester. On installe donc les .component avant.
          AUDIR="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$AUDIR"
          cp -R dist/*.component dist-studio/*.component dist-instruments/*.component "$AUDIR"/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -a 2>&1 | grep -i drmw | tee -a validation.txt || true
          for V in dist/*.vst3 dist-studio/*.vst3 dist-instruments/*.vst3 "$AUDIR"/*.component; do
            [ -e "$V" ] || continue
            P=$(basename "$V")
            ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --skip-gui-tests --timeout-ms 120000 --validate "$V" > "pv-logs/$P.txt" 2>&1
            { echo "--- pluginval $P ---"; tail -4 "pv-logs/$P.txt"; } >> validation.txt
          done
          ditto -c -k pv-logs pluginval-logs-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dreamaws-plugins-macOS
          path: |
            dreamaws-voix-macOS.zip
            dreamaws-studio-macOS.zip
            dreamaws-instruments-macOS.zip
            validation.txt
            pluginval-logs-macOS.zip

      - name: Publier sur la branche builds
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cp dreamaws-voix-macOS.zip dreamaws-studio-macOS.zip dreamaws-instruments-macOS.zip validation.txt out/
          cd out
          git init -q -b builds
          git config user.name build
          git config user.email build@users.noreply.github.com
          git add .
          git commit -qm "build macOS ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
